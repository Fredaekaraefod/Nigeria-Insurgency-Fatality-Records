<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boko Haram Conflict Registry | Database Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for premium UI -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: calc(100vh - 220px);
        }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            min-height: 250px;
            max-height: 300px;
            display: none;
        }
        .chart-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }
        .chart-box canvas {
            max-height: 100%;
            width: 100%;
        }
        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Inter', sans-serif;
            text-align: left;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #d1d5db;
        }
        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: #9ca3af;
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .search-bar {
            margin-bottom: 10px;
        }
        .error-message {
            color: #ef4444;
            padding: 20px;
        }
        .summary-cell {
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .chart-header {
            font-size: 0.8rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-box">
                <i class="ph-fill ph-database"></i>
                <h2>Conflict Registry</h2>
            </div>
            
            <nav class="nav-links">
                <a href="index.html" class="active"><i class="ph ph-magnifying-glass"></i> Explore Data</a>
                <a href="/api/download-db" target="_blank"><i class="ph ph-download-simple"></i> Download DB</a>
            </nav>

            <div class="db-status">
                <div class="status-indicator online"></div>
                <span>Offline SQLite: Read-only</span>
            </div>
        </aside>

        <!-- Main Content Workspace -->
        <main class="workspace">
            <header class="topbar">
                <h1>Historical Incident Records</h1>
                <div class="badge">Scope: 2009 - 2026</div>
            </header>

            <div class="query-section search-bar">
                <div class="input-wrapper">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search incidents (e.g., 'Bombing', 'Borno', '2015')..." autocomplete="off">
                </div>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn" onclick="document.getElementById('searchInput').value='Borno'; document.getElementById('searchInput').dispatchEvent(new Event('input'))">
                    <i class="ph ph-map-pin"></i> Borno Attacks
                </button>
                <button class="filter-btn" onclick="document.getElementById('searchInput').value='ambush'; document.getElementById('searchInput').dispatchEvent(new Event('input'))">
                    <i class="ph ph-crosshair"></i> Ambushes
                </button>
                <button class="filter-btn" onclick="document.getElementById('searchInput').value='suicide bombing'; document.getElementById('searchInput').dispatchEvent(new Event('input'))">
                    <i class="ph ph-warning-circle"></i> Suicide Bombings
                </button>
                <button class="filter-btn" onclick="document.getElementById('searchInput').value='Amnesty'; document.getElementById('searchInput').dispatchEvent(new Event('input'))">
                    <i class="ph ph-scroll"></i> Amnesty Reports
                </button>
                <button class="filter-btn" onclick="document.getElementById('searchInput').value=''; document.getElementById('searchInput').dispatchEvent(new Event('input'))">
                    <i class="ph ph-x-circle"></i> Clear Filters
                </button>
            </div>

            <div id="loadingIndicator" style="display: none; color: #9ca3af; margin-bottom: 15px;"><i class="ph ph-spinner ph-spin"></i> Loading records...</div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="dashboard-grid">
                
                <!-- Charts Row (Approx 1/4th height) -->
                <div class="charts-row" id="chartsRow">
                    <div class="chart-box">
                        <div class="chart-header">Incident Types Distribution</div>
                        <div style="position: relative; height: calc(100% - 25px); width: 100%;">
                            <canvas id="typeChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-box">
                        <div class="chart-header">Reported Fatalities Timeline</div>
                        <div style="position: relative; height: calc(100% - 25px); width: 100%;">
                            <canvas id="timeChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>State</th>
                                <th>Location</th>
                                <th>Attack Type</th>
                                <th>Fatalities</th>
                                <th>Summary</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <!-- Data rows will be inserted here -->
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
